# DMA memory-to-memory sample test definition

sample:
  name: DMA memory-to-memory transfer

tests:
  sample.drivers.dma.mem2mem:
    tags:
      - dma
      - memory
    depends_on:
      - dma
    integration_platforms:
      - nucleo_f429zi
    harness: console
    timeout: 10
    harness_config:
      type: multi_line
      regex:
        - "Starting DMA memory transfer test"
        - "DMA transfer started"
        - "DMA transfer completed"
        - "Data compare success: .*"
        - "Data mismatch!"
